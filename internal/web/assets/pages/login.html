<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rasadbin – Sign in</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="center">
  <main class="card login">
    <h1>Rasadbin</h1>
    <p class="muted">Sign in to continue</p>
    <!-- method/action keep credentials out of the URL if JavaScript fails -->
    <form id="login-form" method="post" action="/login">
      <label>Username
        <input name="username" autocomplete="username" maxlength="128" required autofocus>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" maxlength="128" required>
      </label>
      <button type="submit" id="submit" disabled>Connecting…</button>
      <p id="msg" class="msg" role="alert"></p>
    </form>
  </main>
  <script src="/static/common.js"></script>
  <script src="/static/login.js"></script>
</body>
</html>
