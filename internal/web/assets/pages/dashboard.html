<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rasadbin – Dashboard</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <span class="brand" id="brand">Rasadbin</span>
    <nav>
      <a href="/dashboard" class="active">Dashboard</a>
      <a href="/settings" data-admin hidden>Settings</a>
    </nav>
    <span class="spacer"></span>
    <span id="conn" class="dot" title="disconnected"></span>
    <span id="user" class="muted"></span>
    <button id="logout" class="ghost" type="button">Sign out</button>
  </header>

  <main>
    <section class="grid">
      <div class="card stat"><span class="label">Uptime</span><span class="value" id="s-uptime">–</span></div>
      <div class="card stat"><span class="label">Events received</span><span class="value" id="s-events">–</span></div>
      <div class="card stat"><span class="label">Signed-in clients</span><span class="value" id="s-clients">–</span></div>
      <div class="card stat"><span class="label">Goroutines</span><span class="value" id="s-goroutines">–</span></div>
      <div class="card stat"><span class="label">Heap</span><span class="value" id="s-heap">–</span></div>
      <div class="card stat"><span class="label">Version</span><span class="value" id="s-version">–</span></div>
    </section>

    <section class="card">
      <h2>Heap memory (last few minutes)</h2>
      <svg id="heap" viewBox="0 0 300 60" preserveAspectRatio="none" role="img" aria-label="Heap memory chart"></svg>
    </section>

    <section class="card">
      <h2>Recent events</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Time</th><th>Source</th><th>Severity</th><th>Message</th></tr></thead>
          <tbody id="events"></tbody>
        </table>
      </div>
      <p id="empty" class="muted">No events yet. Collectors are not implemented yet.</p>
    </section>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/dashboard.js"></script>
</body>
</html>
