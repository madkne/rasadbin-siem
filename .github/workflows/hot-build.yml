name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write   # required to push to the hot-build branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.2'
        cache: true
        cache-dependency-path: go.sum

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: webui/package-lock.json

    - name: Build Web UI
      working-directory: webui
      run: |
        npm ci
        npm run build

    - name: Verify build output
      run: |
        test -f webui/dist/index.html || (echo "webui/dist/index.html missing" && exit 1)

    - name: Install Go dependencies
      run: go mod download

    - name: Vet
      run: go vet ./...

    - name: Build
      env:
        CGO_ENABLED: '1'
      run: go build -v ./...

    - name: Test
      env:
        CGO_ENABLED: '1'
      run: go test -v ./...

    - name: Build application binary
      env:
        CGO_ENABLED: '1'
      run: |
        mkdir -p build
        COMMIT="$(git rev-parse --short HEAD)"
        go build \
          -ldflags "-X main.commit=${COMMIT}" \
          -o build/rasadbin \
          ./cmd/app
        ./build/rasadbin version

    - name: Upload binary (artifact, optional)
      uses: actions/upload-artifact@v4
      with:
        name: rasadbin-linux-amd64
        path: build/rasadbin
        if-no-files-found: error

    # ------------------------------------------------------------------
    # Publish binary + webui/dist + .env to the `hot-build` branch
    # ------------------------------------------------------------------
    - name: Prepare hot-build payload
      run: |
        rm -rf hot-build
        mkdir -p hot-build/webui
        cp build/rasadbin hot-build/rasadbin
        cp -r webui/dist hot-build/webui/dist

        # Simple .env — adjust values as needed
        cat > hot-build/.env <<'EOF'
        # Generated by CI — do not edit manually
        HTTP_HOST=127.0.0.1
        HTTP_PORT=9090
        DB_DRIVER=sqlite
        DB_DSN=./data/rasadbin.db
        WEBUI_DIR=webui/dist
        ADMIN_PASSWORD=admin@Pass
        EOF

        # Keep the payload self-documenting
        cat > hot-build/README.md <<'EOF'
        # hot-build

        Auto-generated by GitHub Actions from the `master` branch.

        Contents:
        - `rasadbin`         — Linux amd64 binary
        - `webui/dist/`      — built web UI
        - `.env`             — default runtime config

        Do **not** edit this branch by hand; changes are overwritten on each build.
        EOF

        ls -la hot-build hot-build/webui/dist

    - name: Push to hot-build branch
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd hot-build

        git init -q
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git checkout -q -b hot-build
        git add -A
        git commit -q -m "chore(hot-build): build from ${GITHUB_SHA::7}"

        # Force-push so hot-build always mirrors the latest successful build
        git push --force \
          "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
          hot-build